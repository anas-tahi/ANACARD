services:
  # Static Site
  - type: web
    name: anacard
    env: static
    buildCommand: ""
    staticPublishPath: .
    routes:
      - route: /
        path: index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
